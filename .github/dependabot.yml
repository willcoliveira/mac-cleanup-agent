version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    commit-message: { prefix: chore }
  - package-ecosystem: npm
    directory: /site
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      site: { patterns: ['*'] }
    commit-message: { prefix: chore }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: ci }
